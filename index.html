<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מגן שמיים · Drone Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#080d12;--panel:#0d1520;--border:#1a2d42;
      --accent:#00d4ff;--danger:#ff3c3c;--warn:#ffd600;
      --text:#cde3f5;--muted:#4a6a88;
      --font-mono:'Share Tech Mono','Courier New',monospace;
      --font-ui:'Exo 2','Segoe UI',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
    #app{display:flex;flex-direction:column;height:100dvh}

    /* header */
    #header{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px 8px;z-index:1000}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .logo{display:flex;align-items:center;gap:8px}
    .logo-icon{width:28px;height:28px}
    .logo-icon svg{width:100%;height:100%}
    .logo-title{font-family:var(--font-mono);font-size:1rem;color:var(--accent);letter-spacing:.08em}
    .logo-sub{font-size:.58rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
    .pulse-wrap{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
    .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
    .pulse-dot.live{background:#00e676;animation:pulse 1.6s infinite}
    .pulse-dot.error{background:var(--danger)}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.6)}70%{box-shadow:0 0 0 8px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
    .stats-bar{display:flex;gap:8px}
    .stat-card{flex:1;background:rgba(0,212,255,.06);border:1px solid var(--border);border-radius:6px;padding:5px 8px;text-align:center}
    .stat-value{font-family:var(--font-mono);font-size:1.25rem;line-height:1;color:var(--accent)}
    .stat-value.danger{color:var(--danger)}
    .stat-value.warn{color:var(--warn)}
    .stat-label{font-size:.58rem;color:var(--muted);letter-spacing:.06em;margin-top:2px}

    /* source badge */
    #sourceBadge{
      display:inline-block;margin-top:5px;
      font-family:var(--font-mono);font-size:.6rem;
      color:var(--muted);letter-spacing:.05em;
      background:rgba(255,255,255,.04);border:1px solid var(--border);
      border-radius:4px;padding:2px 6px;
    }

    /* map */
    #map{flex:1;min-height:0;width:100%}
    .leaflet-tile{filter:brightness(.75) saturate(.6) hue-rotate(195deg)}
    .leaflet-container{background:#05090f}

    /* popup */
    .leaflet-popup-content-wrapper{background:var(--panel)!important;border:1px solid var(--border)!important;border-radius:10px!important;color:var(--text)!important;font-family:var(--font-mono)!important;font-size:.78rem!important;padding:0!important;box-shadow:0 4px 24px rgba(0,0,0,.6)!important}
    .leaflet-popup-tip{background:var(--border)!important}
    .leaflet-popup-close-button{color:var(--muted)!important;font-size:16px!important;padding:6px 8px!important}
    .popup-inner{padding:10px 12px}
    .popup-id{color:var(--accent);font-size:.85rem;font-weight:bold;margin-bottom:6px}
    .popup-row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;border-bottom:1px solid var(--border)}
    .popup-row:last-child{border-bottom:none}
    .popup-key{color:var(--muted)}
    .popup-val{color:var(--text);text-align:left}

    /* error panel */
    #errPanel{
      display:none;position:fixed;bottom:0;left:0;right:0;
      background:#100a0a;border-top:1px solid var(--danger);
      padding:10px 14px;z-index:2500;
      font-family:var(--font-mono);font-size:.7rem;color:var(--danger);
    }
    #errPanel.show{display:block}
    #errPanel strong{color:#ff7070}
    #retryBtn{
      margin-top:6px;display:inline-block;
      background:rgba(255,60,60,.15);border:1px solid var(--danger);
      color:var(--danger);border-radius:6px;padding:4px 12px;
      font-family:var(--font-mono);font-size:.7rem;cursor:pointer;
    }
    #retryBtn:active{opacity:.7}

    /* overlay */
    #overlay{position:fixed;inset:0;background:rgba(8,13,18,.97);z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:var(--font-mono)}
    .ov-spinner{width:56px;height:56px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ov-text{color:var(--text);font-size:.95rem;text-align:center;line-height:1.8}
    .ov-sub{color:var(--muted);font-size:.7rem}

    @keyframes flashBorder{0%{border-color:var(--accent)}100%{border-color:var(--border)}}
    .flash{animation:flashBorder .7s ease-out}
  </style>
</head>
<body>

<div id="overlay">
  <div class="ov-spinner"></div>
  <div class="ov-text">מגן שמיים<br><span class="ov-sub" id="ovMsg">ממתין לאישור GPS…</span></div>
</div>

<div id="app">
  <div id="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="4" fill="#00d4ff"/>
            <rect x="13" y="4"  width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="13" y="22" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="4"  y="13" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="22" y="13" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <line x1="13" y1="13" x2="8"  y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="19" y1="13" x2="24" y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="13" y1="19" x2="8"  y2="24" stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="19" y1="19" x2="24" y2="24" stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
          </svg>
        </div>
        <div>
          <div class="logo-title">מגן שמיים</div>
          <div class="logo-sub">Drone Radar · 30km</div>
        </div>
      </div>
      <div class="pulse-wrap">
        <div class="pulse-dot" id="liveDot"></div>
        <span id="lastUpdate">--:--:--</span>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-card" id="card-total">
        <div class="stat-value" id="val-total">—</div>
        <div class="stat-label">כלי טיס נמוכים</div>
      </div>
      <div class="stat-card" id="card-low">
        <div class="stat-value danger" id="val-low">—</div>
        <div class="stat-label">מתחת ל-150 מ'</div>
      </div>
      <div class="stat-card" id="card-next">
        <div class="stat-value warn" id="val-next">10</div>
        <div class="stat-label">שניות לרענון</div>
      </div>
    </div>
    <div style="text-align:center"><span id="sourceBadge">ממתין…</span></div>
  </div>
  <div id="map"></div>
</div>

<!-- Error panel -->
<div id="errPanel">
  <strong>⚠ שגיאת רשת — פרטים:</strong><br>
  <span id="errMsg">—</span><br>
  <button id="retryBtn" onclick="retryNow()">↺ נסה עכשיו</button>
</div>

<script>
/* ══════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════ */
const REFRESH_MS = 10_000;
const RADIUS_KM  = 30;
const RADIUS_NM  = Math.ceil(RADIUS_KM / 1.852);  // 17 NM
const MAX_ALT_FT = 1640;   // 500 m
const LOW_ALT_FT = 492;    // 150 m

/* ══════════════════════════════════════════════
   API SOURCES — tried in order, auto-fallback
══════════════════════════════════════════════ */
const SOURCES = [
  {
    name: 'adsb.fi',
    url: (lat,lon) => `https://api.adsb.fi/v1/aircraft?lat=${lat}&lon=${lon}&dist=${RADIUS_NM}`,
    parse: d => d.ac || []
  },
  {
    name: 'airplanes.live',
    url: (lat,lon) => `https://api.airplanes.live/v2/point/${lat}/${lon}/${RADIUS_NM}`,
    parse: d => d.ac || []
  },
  {
    name: 'OpenSky (proxy)',
    url: (lat,lon) => {
      const d = RADIUS_KM / 111.32;
      const base = `https://opensky-network.org/api/states/all?lamin=${(lat-d).toFixed(4)}&lomin=${(lon-d).toFixed(4)}&lamax=${(lat+d).toFixed(4)}&lomax=${(lon+d).toFixed(4)}`;
      return `https://corsproxy.io/?url=${encodeURIComponent(base)}`;
    },
    parse: d => {
      // OpenSky format — convert to unified ac[] format
      return (d.states || []).map(s => ({
        hex: s[0], flight: s[1],
        lon: s[5], lat: s[6],
        alt_baro: s[7] != null ? s[7] * 3.281 : null,  // m→ft
        gs: s[9] != null ? s[9] * 1.944 : null           // m/s→kn
      }));
    }
  }
];

let activeSource = 0;  // index into SOURCES[]

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let map, userMarker, userLatLng;
let markers = {};
let countdown = 10;
let countdownTimer = null;
let fetchTimer    = null;

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const ft2m  = ft => Math.round(ft * 0.3048);
const kn2kh = kn => Math.round(kn * 1.852);

function dist_km(la1,lo1,la2,lo2){
  const R=6371,r=Math.PI/180;
  const dL=(la2-la1)*r,dO=(lo2-lo1)*r;
  const a=Math.sin(dL/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function flash(id){
  const el=$(id);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

function showError(msg){
  $('errMsg').textContent = msg;
  $('errPanel').classList.add('show');
  $('liveDot').className = 'pulse-dot error';
  console.error('[DroneRadar]', msg);
}

function clearError(){
  $('errPanel').classList.remove('show');
}

function setBadge(text){
  $('sourceBadge').textContent = 'מקור: ' + text;
}

/* ══════════════════════════════════════════════
   COUNTDOWN TIMER (visual)
══════════════════════════════════════════════ */
function startCountdown(){
  clearInterval(countdownTimer);
  countdown = REFRESH_MS / 1000;
  $('val-next').textContent = countdown;
  countdownTimer = setInterval(() => {
    countdown = Math.max(0, countdown - 1);
    $('val-next').textContent = countdown;
  }, 1000);
}

/* ══════════════════════════════════════════════
   ICONS
══════════════════════════════════════════════ */
function droneIcon(altFt){
  const col  = altFt < LOW_ALT_FT ? '#ff3c3c' : '#ff8c00';
  const glow = altFt < LOW_ALT_FT ? 'rgba(255,60,60,.55)' : 'rgba(255,140,0,.45)';
  const svg  = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="5" fill="${col}" opacity=".18"/>
    <circle cx="16" cy="16" r="3" fill="${col}"/>
    <rect x="13.5" y="5"    width="5" height="5" rx="2" fill="${col}"/>
    <rect x="13.5" y="22"   width="5" height="5" rx="2" fill="${col}"/>
    <rect x="5"    y="13.5" width="5" height="5" rx="2" fill="${col}"/>
    <rect x="22"   y="13.5" width="5" height="5" rx="2" fill="${col}"/>
    <line x1="13.5" y1="13.5" x2="9"  y2="9"  stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="18.5" y1="13.5" x2="23" y2="9"  stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="13.5" y1="18.5" x2="9"  y2="23" stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="18.5" y1="18.5" x2="23" y2="23" stroke="${col}" stroke-width="1.5" opacity=".6"/>
  </svg>`;
  return L.divIcon({
    html:`<div style="filter:drop-shadow(0 0 5px ${glow})">${svg}</div>`,
    iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-17],className:''
  });
}

function userIcon(){
  return L.divIcon({
    html:`<div style="width:16px;height:16px;border-radius:50%;
      background:rgba(0,120,255,.9);border:3px solid #fff;
      box-shadow:0 0 0 5px rgba(0,120,255,.3)"></div>`,
    iconSize:[16,16],iconAnchor:[8,8],className:''
  });
}

/* ══════════════════════════════════════════════
   POPUP
══════════════════════════════════════════════ */
function makePopup(ac, d){
  const cs   = (ac.flight||ac.hex||'').trim()||ac.hex;
  const altFt= typeof ac.alt_baro==='number' ? Math.round(ac.alt_baro) : 0;
  const altM = ft2m(altFt);
  const spd  = ac.gs!=null ? kn2kh(ac.gs)+' קמ"ש' : '?';
  const sq   = ac.squawk||'—';
  return `<div class="popup-inner">
    <div class="popup-id">✈ ${cs}</div>
    <div class="popup-row"><span class="popup-key">ICAO24</span><span class="popup-val">${ac.hex}</span></div>
    <div class="popup-row"><span class="popup-key">גובה</span><span class="popup-val">${altM} מ' (${altFt} ft)</span></div>
    <div class="popup-row"><span class="popup-key">מהירות</span><span class="popup-val">${spd}</span></div>
    <div class="popup-row"><span class="popup-key">מרחק</span><span class="popup-val">${d.toFixed(1)} ק"מ</span></div>
    <div class="popup-row"><span class="popup-key">Squawk</span><span class="popup-val">${sq}</span></div>
  </div>`;
}

/* ══════════════════════════════════════════════
   FETCH — try each source, auto-fallback
══════════════════════════════════════════════ */
async function tryFetch(lat, lon) {
  const errors = [];

  for (let i = 0; i < SOURCES.length; i++) {
    const src = SOURCES[i];
    const url = src.url(lat, lon);
    console.log(`[DroneRadar] trying ${src.name}: ${url}`);
    try {
      const res = await fetch(url, {
        signal: AbortSignal.timeout(9000),
        headers: { 'Accept': 'application/json' }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const data = await res.json();
      const aircraft = src.parse(data);
      activeSource = i;
      setBadge(src.name);
      console.log(`[DroneRadar] ✓ ${src.name} → ${aircraft.length} aircraft`);
      return aircraft;  // success
    } catch(e) {
      const msg = `${src.name}: ${e.message}`;
      errors.push(msg);
      console.warn(`[DroneRadar] ✗ ${msg}`);
    }
  }

  // all sources failed
  throw new Error(errors.join(' | '));
}

/* ══════════════════════════════════════════════
   UPDATE MAP
══════════════════════════════════════════════ */
async function fetchAircraft(){
  if (!userLatLng) return;
  const {lat, lng} = userLatLng;
  startCountdown();

  let aircraft;
  try {
    aircraft = await tryFetch(lat, lng);
    clearError();
    $('liveDot').className = 'pulse-dot live';
  } catch(e) {
    showError(e.message);
    return;
  }

  const liveSet = new Set();
  let countLow  = 0;

  aircraft.forEach(ac => {
    const hex  = ac.hex;
    const lat2 = ac.lat;
    const lon2 = ac.lon;
    if (!hex || lat2==null || lon2==null) return;

    const altFt = typeof ac.alt_baro==='number' ? ac.alt_baro
                : ac.alt_baro==='ground'        ? 0
                : typeof ac.alt_geom==='number'  ? ac.alt_geom
                : 9999;

    if (altFt > MAX_ALT_FT) return;

    const d = dist_km(lat, lng, lat2, lon2);
    if (d > RADIUS_KM) return;

    liveSet.add(hex);
    if (altFt <= LOW_ALT_FT) countLow++;

    const html = makePopup(ac, d);

    if (markers[hex]) {
      markers[hex].setLatLng([lat2, lon2]);
      markers[hex].setIcon(droneIcon(altFt));
      markers[hex].getPopup().setContent(html);
    } else {
      markers[hex] = L.marker([lat2,lon2],{icon:droneIcon(altFt)})
        .bindPopup(html,{maxWidth:240,minWidth:190})
        .addTo(map);
    }
  });

  Object.keys(markers).forEach(hex => {
    if (!liveSet.has(hex)) { map.removeLayer(markers[hex]); delete markers[hex]; }
  });

  $('val-total').textContent = liveSet.size;
  $('val-low').textContent   = countLow;
  $('lastUpdate').textContent= new Date().toLocaleTimeString('he-IL',{hour12:false});
  flash('card-total');
}

function retryNow(){
  clearInterval(fetchTimer);
  fetchAircraft();
  fetchTimer = setInterval(fetchAircraft, REFRESH_MS);
}

/* ══════════════════════════════════════════════
   MAP INIT
══════════════════════════════════════════════ */
function initMap(lat, lng){
  map = L.map('map',{center:[lat,lng],zoom:11,zoomControl:true,attributionControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
  L.circle([lat,lng],{radius:RADIUS_KM*1000,color:'#00d4ff',weight:1,opacity:.3,fillColor:'#00d4ff',fillOpacity:.04}).addTo(map);
  userMarker = L.marker([lat,lng],{icon:userIcon(),zIndexOffset:1000})
    .addTo(map)
    .bindPopup('<div class="popup-inner"><div class="popup-id">📍 מיקומך</div></div>');
  userLatLng = {lat,lng};
  $('overlay').style.display = 'none';
  fetchAircraft();
  fetchTimer = setInterval(fetchAircraft, REFRESH_MS);
}

/* ══════════════════════════════════════════════
   GPS
══════════════════════════════════════════════ */
navigator.geolocation
  ? navigator.geolocation.watchPosition(
      pos => {
        const {latitude:lat,longitude:lng} = pos.coords;
        if (!map) initMap(lat,lng);
        else { userLatLng={lat,lng}; userMarker.setLatLng([lat,lng]); }
      },
      err => {
        const m={1:'לא אושרה גישה למיקום',2:'המיקום אינו זמין',3:'תם זמן GPS'};
        $('ovMsg').textContent = m[err.code]||'שגיאת GPS';
      },
      {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
    )
  : ($('ovMsg').textContent = 'הדפדפן אינו תומך ב-GPS');
</script>
</body>
</html>
