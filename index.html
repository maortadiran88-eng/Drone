<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מגן שמיים · Drone Tracker</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #080d12;
      --panel:     #0d1520;
      --border:    #1a2d42;
      --accent:    #00d4ff;
      --danger:    #ff3c3c;
      --warn:      #ffd600;
      --text:      #cde3f5;
      --muted:     #4a6a88;
      --font-mono: 'Share Tech Mono', 'Courier New', monospace;
      --font-ui:   'Exo 2', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ── */
    #header {
      flex-shrink: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 8px;
      position: relative;
      z-index: 1000;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 28px; height: 28px; }
    .logo-icon svg { width: 100%; height: 100%; }

    .logo-title {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .logo-sub {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .pulse-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .pulse-dot.live {
      background: #00e676;
      box-shadow: 0 0 0 0 rgba(0,230,118,0.6);
      animation: pulse 1.6s infinite;
    }

    .pulse-dot.error { background: var(--danger); }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(0,230,118,0.6); }
      70%  { box-shadow: 0 0 0 8px rgba(0,230,118,0); }
      100% { box-shadow: 0 0 0 0   rgba(0,230,118,0); }
    }

    .stats-bar { display: flex; gap: 8px; }

    .stat-card {
      flex: 1;
      background: rgba(0,212,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      text-align: center;
      transition: border-color 0.6s;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      line-height: 1;
      color: var(--accent);
    }

    .stat-value.danger { color: var(--danger); }
    .stat-value.warn   { color: var(--warn); }

    .stat-label {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* ── Map ── */
    #map { flex: 1; min-height: 0; width: 100%; }

    .leaflet-tile { filter: brightness(0.75) saturate(0.6) hue-rotate(195deg); }
    .leaflet-container { background: #05090f; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      color: var(--text) !important;
      font-family: var(--font-mono) !important;
      font-size: 0.78rem !important;
      padding: 0 !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6) !important;
    }

    .leaflet-popup-tip { background: var(--border) !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; font-size: 16px !important; padding: 6px 8px !important; }

    .popup-inner { padding: 10px 12px; }
    .popup-id { color: var(--accent); font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; }

    .popup-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
    }

    .popup-row:last-child { border-bottom: none; }
    .popup-key { color: var(--muted); }
    .popup-val { color: var(--text); text-align: left; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13,21,32,0.97);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.72rem;
      color: var(--text);
      font-family: var(--font-mono);
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    #toast.show { opacity: 1; }
    #toast.err  { border-color: var(--danger); color: var(--danger); }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(8,13,18,0.97);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: var(--font-mono);
    }

    .overlay-spinner {
      width: 56px; height: 56px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay-text { color: var(--text); font-size: 0.95rem; text-align: center; line-height: 1.8; }
    .overlay-sub  { color: var(--muted); font-size: 0.7rem; }

    @keyframes flashBorder {
      0%   { border-color: var(--accent); }
      100% { border-color: var(--border); }
    }
    .flash { animation: flashBorder 0.7s ease-out; }
  </style>
</head>
<body>

<div id="overlay">
  <div class="overlay-spinner"></div>
  <div class="overlay-text">
    מגן שמיים<br>
    <span class="overlay-sub" id="overlayMsg">ממתין לאישור GPS…</span>
  </div>
</div>

<div id="app">
  <div id="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="4" fill="#00d4ff"/>
            <rect x="13" y="4"  width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="13" y="22" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="4"  y="13" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <rect x="22" y="13" width="6" height="6" rx="2" fill="#00d4ff" opacity=".7"/>
            <line x1="13" y1="13" x2="8"  y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="19" y1="13" x2="24" y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="13" y1="19" x2="8"  y2="24" stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
            <line x1="19" y1="19" x2="24" y2="24" stroke="#00d4ff" stroke-width="1.5" opacity=".4"/>
          </svg>
        </div>
        <div>
          <div class="logo-title">מגן שמיים</div>
          <div class="logo-sub">Drone Radar · 30km</div>
        </div>
      </div>
      <div class="pulse-wrap">
        <div class="pulse-dot" id="liveDot"></div>
        <span id="lastUpdate">--:--:--</span>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card" id="card-total">
        <div class="stat-value" id="val-total">—</div>
        <div class="stat-label">כלי טיס נמוכים</div>
      </div>
      <div class="stat-card" id="card-low">
        <div class="stat-value danger" id="val-low">—</div>
        <div class="stat-label">מתחת ל-150 מ'</div>
      </div>
      <div class="stat-card" id="card-radius">
        <div class="stat-value warn" id="val-radius">30</div>
        <div class="stat-label">רדיוס ק"מ</div>
      </div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div id="toast"></div>

<script>
/* ── Config ── */
const REFRESH_MS  = 10_000;
const RADIUS_KM   = 30;
const RADIUS_NM   = Math.ceil(RADIUS_KM / 1.852);   // ~17 NM
const MAX_ALT_FT  = 1640;   // 500 m in feet
const LOW_ALT_FT  = 492;    // 150 m in feet

/* adsb.fi — CORS-enabled, free, no key required */
const API_URL = (lat, lon) =>
  `https://api.adsb.fi/v1/aircraft?lat=${lat}&lon=${lon}&dist=${RADIUS_NM}`;

/* ── State ── */
let map, userMarker, userLatLng;
let markers   = {};   // hex → L.marker
let fetchTimer = null;
let consecutiveErrors = 0;

/* ── DOM helpers ── */
const $  = id => document.getElementById(id);
const ft2m = ft => Math.round(ft * 0.3048);
const kn2kmh = kn => Math.round(kn * 1.852);

function toast(msg, isErr = false, ms = 3000) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', isErr);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function flash(id) {
  const el = $(id);
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

/* ── Haversine ── */
function dist_km(lat1, lon1, lat2, lon2) {
  const R  = 6371, d2r = Math.PI / 180;
  const dL = (lat2 - lat1) * d2r, dO = (lon2 - lon1) * d2r;
  const a  = Math.sin(dL/2)**2
            + Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dO/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ── Icons ── */
function droneIcon(altFt) {
  const col = altFt < LOW_ALT_FT ? '#ff3c3c' : '#ff8c00';
  const glow= altFt < LOW_ALT_FT ? 'rgba(255,60,60,0.55)' : 'rgba(255,140,0,0.45)';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="5" fill="${col}" opacity="0.18"/>
    <circle cx="16" cy="16" r="3" fill="${col}"/>
    <rect x="13.5" y="5"  width="5" height="5" rx="2" fill="${col}"/>
    <rect x="13.5" y="22" width="5" height="5" rx="2" fill="${col}"/>
    <rect x="5"  y="13.5" width="5" height="5" rx="2" fill="${col}"/>
    <rect x="22" y="13.5" width="5" height="5" rx="2" fill="${col}"/>
    <line x1="13.5" y1="13.5" x2="9"  y2="9"  stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="18.5" y1="13.5" x2="23" y2="9"  stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="13.5" y1="18.5" x2="9"  y2="23" stroke="${col}" stroke-width="1.5" opacity=".6"/>
    <line x1="18.5" y1="18.5" x2="23" y2="23" stroke="${col}" stroke-width="1.5" opacity=".6"/>
  </svg>`;
  return L.divIcon({
    html: `<div style="filter:drop-shadow(0 0 5px ${glow})">${svg}</div>`,
    iconSize: [34,34], iconAnchor: [17,17], popupAnchor: [0,-17], className: ''
  });
}

function userIcon() {
  return L.divIcon({
    html: `<div style="width:16px;height:16px;border-radius:50%;
      background:rgba(0,120,255,0.9);border:3px solid #fff;
      box-shadow:0 0 0 5px rgba(0,120,255,0.3)"></div>`,
    iconSize: [16,16], iconAnchor: [8,8], className: ''
  });
}

/* ── Popup HTML ── */
function popupHtml(ac, distKm) {
  const callsign = (ac.flight || ac.hex || '').trim() || ac.hex;
  const altFt    = typeof ac.alt_baro === 'number' ? ac.alt_baro : 0;
  const altM     = ft2m(altFt);
  const speedKmh = ac.gs != null ? kn2kmh(ac.gs) : '?';
  const squawk   = ac.squawk || '—';
  return `<div class="popup-inner">
    <div class="popup-id">✈ ${callsign}</div>
    <div class="popup-row"><span class="popup-key">ICAO24</span><span class="popup-val">${ac.hex}</span></div>
    <div class="popup-row"><span class="popup-key">גובה</span><span class="popup-val">${altM} מ' (${altFt} ft)</span></div>
    <div class="popup-row"><span class="popup-key">מהירות</span><span class="popup-val">${speedKmh} קמ"ש</span></div>
    <div class="popup-row"><span class="popup-key">מרחק</span><span class="popup-val">${distKm.toFixed(1)} ק"מ</span></div>
    <div class="popup-row"><span class="popup-key">Squawk</span><span class="popup-val">${squawk}</span></div>
  </div>`;
}

/* ── Fetch ── */
async function fetchAircraft() {
  if (!userLatLng) return;
  const { lat, lng } = userLatLng;

  let aircraft = [];
  try {
    const res = await fetch(API_URL(lat, lng), {
      signal: AbortSignal.timeout(8000),
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    aircraft = data.ac || [];
    consecutiveErrors = 0;
    $('liveDot').className = 'pulse-dot live';
  } catch (err) {
    consecutiveErrors++;
    $('liveDot').className = 'pulse-dot error';
    console.warn('Fetch error:', err.message);
    toast(`⚠ שגיאת רשת (${err.message.slice(0,40)})`, true, 4000);
    return;
  }

  const liveSet = new Set();
  let countLow  = 0;

  aircraft.forEach(ac => {
    const hex  = ac.hex;
    const lat2 = ac.lat;
    const lon2 = ac.lon;
    if (!hex || lat2 == null || lon2 == null) return;

    /* altitude — adsb.fi gives feet; "ground" string means 0 */
    const altFt = typeof ac.alt_baro === 'number' ? ac.alt_baro :
                  (ac.alt_baro === 'ground' ? 0 :
                  (typeof ac.alt_geom === 'number' ? ac.alt_geom : 9999));

    /* filter: only below 500 m */
    if (altFt > MAX_ALT_FT) return;

    /* strict circle filter */
    const d = dist_km(lat, lng, lat2, lon2);
    if (d > RADIUS_KM) return;

    liveSet.add(hex);
    if (altFt <= LOW_ALT_FT) countLow++;

    const html = popupHtml(ac, d);

    if (markers[hex]) {
      markers[hex].setLatLng([lat2, lon2]);
      markers[hex].setIcon(droneIcon(altFt));
      markers[hex].getPopup().setContent(html);
    } else {
      markers[hex] = L.marker([lat2, lon2], { icon: droneIcon(altFt) })
        .bindPopup(html, { maxWidth: 240, minWidth: 190 })
        .addTo(map);
    }
  });

  /* remove stale */
  Object.keys(markers).forEach(hex => {
    if (!liveSet.has(hex)) {
      map.removeLayer(markers[hex]);
      delete markers[hex];
    }
  });

  /* stats */
  $('val-total').textContent = liveSet.size;
  $('val-low').textContent   = countLow;
  $('val-radius').textContent= RADIUS_KM;
  $('lastUpdate').textContent= new Date().toLocaleTimeString('he-IL', { hour12: false });

  flash('card-total');
}

/* ── Map init ── */
function initMap(lat, lng) {
  map = L.map('map', {
    center: [lat, lng], zoom: 11,
    zoomControl: true, attributionControl: false
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

  /* radius ring */
  L.circle([lat, lng], {
    radius: RADIUS_KM * 1000,
    color: '#00d4ff', weight: 1, opacity: 0.3,
    fillColor: '#00d4ff', fillOpacity: 0.04
  }).addTo(map);

  userMarker = L.marker([lat, lng], { icon: userIcon(), zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup('<div class="popup-inner"><div class="popup-id">📍 מיקומך</div></div>');

  userLatLng = { lat, lng };
  $('overlay').style.display = 'none';

  fetchAircraft();
  fetchTimer = setInterval(fetchAircraft, REFRESH_MS);
}

/* ── GPS ── */
function startGPS() {
  if (!navigator.geolocation) {
    $('overlayMsg').textContent = 'הדפדפן אינו תומך ב-GPS';
    return;
  }

  navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      if (!map) {
        initMap(lat, lng);
      } else {
        userLatLng = { lat, lng };
        userMarker.setLatLng([lat, lng]);
      }
    },
    err => {
      const msgs = {
        1: 'לא אושרה גישה למיקום — אנא אפשר GPS בהגדרות',
        2: 'המיקום אינו זמין כרגע',
        3: 'תם זמן קבלת המיקום'
      };
      $('overlayMsg').textContent = msgs[err.code] || 'שגיאת GPS';
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

startGPS();
</script>
</body>
</html>
